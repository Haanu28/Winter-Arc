<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WINTER ARC // Elite Command OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #04070c;
            --bg-card: #0b111e;
            --bg-panel: #121a2d;
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-purple: #7000ff;
            --accent-red: #ff3366;
            --accent-gold: #ffb703;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-glow: rgba(0, 242, 254, 0.15);
            --border-card: #1e293b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-card);
        }
        .brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-group {
            display: flex;
            gap: 0.75rem;
        }
        .btn {
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--border-card);
            background: var(--bg-panel);
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-1px);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #000;
            border: none;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1.5rem;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 14px;
            padding: 1.5rem;
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 99;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--accent-cyan);
            width: 90%;
            max-width: 500px;
            border-radius: 16px;
            padding: 2rem;
        }
        .hero {
            grid-column: span 12;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #0b111e, #141c2e);
            border-left: 4px solid var(--accent-cyan);
            flex-wrap: wrap;
            gap: 1rem;
        }
        .countdown-box {
            display: flex;
            gap: 0.75rem;
            background: var(--bg-panel);
            padding: 0.75rem 1.25rem;
            border-radius: 10px;
            border: 1px solid var(--border-card);
            align-items: center;
        }
        .countdown-unit {
            text-align: center;
        }
        .countdown-num {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent-cyan);
        }
        .countdown-label {
            font-size: 0.65rem;
            color: var(--text-sub);
            text-transform: uppercase;
        }
        .pillar-nav {
            grid-column: span 12;
            display: flex;
            gap: 1rem;
        }
        .pillar-btn {
            flex: 1;
            padding: 0.8rem;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            text-align: center;
            color: var(--text-sub);
            cursor: pointer;
            font-weight: 600;
        }
        .pillar-btn.active {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }
        .tracker-main {
            grid-column: span 8;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .side-bar {
            grid-column: span 4;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .task-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: var(--bg-panel);
            border-radius: 10px;
            margin-bottom: 0.75rem;
            border: 1px solid transparent;
        }
        .task-row:hover {
            border-color: var(--border-glow);
        }
        .task-row.done {
            opacity: 0.6;
        }
        .task-row.done .task-title {
            text-decoration: line-through;
        }
        .checkbox {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .task-row.done .checkbox {
            background: var(--accent-cyan);
            border-color: var(--accent-cyan);
            color: #000;
            font-weight: 900;
        }
        .journal-input {
            width: 100%;
            height: 120px;
            background: var(--bg-panel);
            border: 1px solid var(--border-card);
            border-radius: 10px;
            color: var(--text-main);
            padding: 1rem;
            margin-top: 0.75rem;
            resize: vertical;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .journal-input:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }
        .badge-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .badge {
            background: var(--bg-panel);
            padding: 0.75rem;
            border-radius: 8px;
            text-align: center;
            opacity: 0.3;
            filter: grayscale(1);
            font-size: 0.75rem;
        }
        .badge.unlocked {
            opacity: 1;
            filter: grayscale(0);
            border: 1px solid var(--accent-gold);
        }
        @media (max-width: 900px) {
            .tracker-main, .side-bar { grid-column: span 12; }
        }
    </style>
</head>
